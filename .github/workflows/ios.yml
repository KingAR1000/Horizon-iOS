name: Build unsigned iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID || '331e08f8-172d-43b9-835a-3108c2fcdbf3' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25.0.4
      - name: Install pinned Rust
        run: rustup show
      - name: Validate patched dependencies
        run: |
          ./scripts/prepare.sh
          cargo metadata --locked --filter-platform aarch64-apple-ios --format-version 1 > /dev/null
      - name: Build and package
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Horizon-unsigned
          path: |
            build/Horizon-unsigned.ipa
            ios/Memory.entitlements
          if-no-files-found: error
