[package]
name = "horizon-ios-bootstrap"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
horizon-prepare = { path = "../engine/crates/horizon-prepare" }
ristretto_vm = { version = "=0.34.0", default-features = false }
tokio = { version = "1", features = ["rt", "time", "net", "fs", "sync"] }
serde_json = "1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
ristretto_gc = "=0.34.0"
